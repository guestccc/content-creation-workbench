[project]
name = "content-workbench-backend"
version = "0.1.0"
description = "content-creation-workbench - 后端服务（FastAPI）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # 一键成品的 AI 文案生成走 OpenAI 兼容的 chat/completions（httpx 直连）。
    # 它原本只在 dev 组里给测试客户端用，现在运行期也要依赖。
    "httpx>=0.28.0",
    "numpy>=2.4",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    # starlette 内部测试客户端对 httpx 的弃用提示，与业务代码无关，屏蔽以保持输出干净
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
