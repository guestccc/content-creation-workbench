[project]
name = "content-workbench-cli"
version = "0.1.0"
description = "内容创作工作台 - 开发服务管理 CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.26 起 Typer 内联了 Click（requires_dist 里已无 click 依赖），
    # 因此本项目的代码中不能出现 import click，需要异常类型时用 typer.Abort / typer.Exit
    "typer>=0.27.2,<0.28",
    "questionary>=2.1.1,<3",
    # questionary 只要求 prompt-toolkit>=2.0，但带 Python 3.14 支持的是 3.0.53，
    # 这个下限是必需的，否则可能解析到不支持当前解释器的老版本
    "prompt-toolkit>=3.0.53,<4",
    "rich>=13.8,<16",
    # 提供 create_time 指纹（防 PID 复用）、进程组枚举与端口归属查询，
    # 有 cp36-abi3 预编译 wheel，各版本 Python 上均无需编译
    "psutil>=7.2.2,<8",
]

[project.scripts]
cw = "cw.main:main"

# 没有 build-system 时 [project.scripts] 不会被安装，
# cli/.venv/bin/cw 也就不会生成
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cw"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
